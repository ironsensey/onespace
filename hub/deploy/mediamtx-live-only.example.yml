# Based on upstream MediaMTX v1.21.2 configuration names. This is a separate
# example, NOT a patch to apply blindly to your existing mediamtx.yml.
# No footage is written. OneSpace exposes authenticated TLS WHEP signaling;
# RTSP publishing and MediaMTX HTTP signaling are accessible only locally.
logLevel: info
logDestinations: [stdout]
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: [127.0.0.1, '::1']
    permissions:
      - action: publish
        path: camera
      - action: read
        path: camera
api: false
metrics: false
pprof: false
playback: false
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
hls: false
srt: false
moq: false
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: false
webrtcAllowOrigins: []
# DTLS-SRTP media is encrypted; only clients holding a valid WHEP negotiation
# can establish the peer connection. Firewall this port to LAN/overlay peers.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: []
webrtcICEServers2: []
pathDefaults:
  record: false
paths:
  camera:
    source: publisher
    record: false
