name: OneSpace independent build checks
# Only this development branch is automatic. No schedule or release keys.
on:
  workflow_dispatch:
  push:
    branches: [dev/onespace-independent-connect]
permissions:
  contents: read
jobs:
  linux-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: hub/go.mod
      - run: go test -race -p 1 ./...
        working-directory: hub
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run direct real-media decoded-frame test
        run: sh tests/real-media/run.sh
      - name: Upload receiver output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-receiver-output
          path: tests/real-media/receiver-output.txt
          if-no-files-found: ignore

  media-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run forced TURN decoded-frame test
        working-directory: tests/real-media
        run: |
          docker compose --profile turn up -d mediamtx publisher coordinator bridge coturn
          trap 'docker compose --profile turn down -v' EXIT
          echo "=== Services started ==="
          docker compose --profile turn ps
          echo "=== Coturn logs ==="
          docker compose --profile turn logs coturn --tail=20 || true
          echo "=== Running receiver ==="
          TURN_URL=turn:coturn:3478?transport=udp \
          TURN_USERNAME=testuser \
          TURN_CREDENTIAL=testpassword \
          FORCE_RELAY=1 docker compose --profile turn run --rm receiver
          echo "=== Receiver completed ==="
      - name: Upload receiver output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-turn-receiver-output
          path: tests/real-media/receiver-output.txt
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: windows/go.sum
      - run: go test -race -p 1 ./...
        working-directory: windows
        env:
          ONESPACE_WINDOWS_CLIPBOARD_TEST: "1"
      - run: go build -buildvcs=false -trimpath -ldflags "-H=windowsgui" -o ../OneSpace.exe ./cmd/onespace
        working-directory: windows
      - shell: powershell
        run: ./tools/Test-NativeWindows.ps1 -Executable ./OneSpace.exe
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: windows/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
        working-directory: hub
      - run: govulncheck ./...
        working-directory: windows
        env:
          GOOS: windows
          GOARCH: amd64
